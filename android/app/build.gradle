plugins { id 'com.android.application' }

android {
    namespace 'de.lernapp.deutsch'
    compileSdk 34
    defaultConfig {
        applicationId "de.lernapp.deutsch"
        minSdk 24
        targetSdk 34
        versionCode Integer.parseInt(System.getenv("VERSION_CODE") ?: "1")
        versionName "1." + (System.getenv("VERSION_CODE") ?: "0")
    }
    signingConfigs {
        release {
            storeFile file(System.getenv("KEYSTORE_FILE") ?: "../keystore/app.jks")
            storePassword System.getenv("KEYSTORE_PASSWORD") ?: "deutschlernen"
            keyAlias "deutsch"
            keyPassword System.getenv("KEYSTORE_PASSWORD") ?: "deutschlernen"
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    lint {
        checkReleaseBuilds false
        abortOnError false
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
