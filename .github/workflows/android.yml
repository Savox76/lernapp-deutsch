name: Android-App bauen
on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: APK bauen
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: gradle assembleRelease --no-daemon
      - name: APK umbenennen
        run: cp android/app/build/outputs/apk/release/app-release.apk deutsch-lernen.apk
      - uses: actions/upload-artifact@v4
        with: { name: deutsch-lernen-apk, path: deutsch-lernen.apk }
      - name: Als Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v${{ github.run_number }}
          name: Android-App Version ${{ github.run_number }}
          make_latest: "true"
          body: |
            Zum Installieren auf dem Android-Handy die Datei **deutsch-lernen.apk** herunterladen und öffnen.
            Beim ersten Mal muss die Installation aus unbekannten Quellen erlaubt werden.
          files: deutsch-lernen.apk
